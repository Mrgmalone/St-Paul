<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>St. Paul Apostolic Church of Jesus Christ | Greensboro, North Carolina</title>
  <meta name="description" content="St. Paul Apostolic Church of Jesus Christ in Greensboro, North Carolina — a Christ-centered Apostolic church committed to worship, biblical teaching, prayer, holiness, fellowship, and service.">
  <meta name="theme-color" content="#0a1a48">
  <meta property="og:type" content="website">
  <meta property="og:title" content="St. Paul Apostolic Church of Jesus Christ">
  <meta property="og:description" content="A Christ-centered Apostolic church in Greensboro, North Carolina.">
  <meta property="og:image" content="assets/img/brand/social-preview.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preload" as="image" href="assets/img/photos/worship-preaching-a-1920.webp" imagesrcset="assets/img/photos/worship-preaching-a-960.webp 960w, assets/img/photos/worship-preaching-a-1920.webp 1920w" imagesizes="100vw">
  <script src="js/site.js" defer></script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <!-- HERO -->
    <section class="hero" aria-labelledby="hero-title">
      <div class="hero-media" id="home-hero-media" data-hero="home.hero"></div>
      <div class="container hero-inner">
        <div class="reveal">
          <h1 id="hero-title"><span class="small" data-bind="home.hero.eyebrow"></span><span data-bind="home.hero.title"></span></h1>
          <p class="hero-loc" data-bind="home.hero.location"></p>
          <p class="hero-text" data-bind="home.hero.text"></p>
          <div class="btn-row" id="hero-buttons"></div>
        </div>
        <div class="hero-cross reveal reveal-delay-2" data-cross></div>
      </div>
      <div class="hero-wave"></div>
    </section>

    <!-- SERVICE TIMES + UPCOMING EVENTS -->
    <section class="section" style="padding-top:0">
      <div class="container home-intro">
        <div class="card glass services-card reveal" id="service-times">
          <div class="card-title"><span data-icon="clock"></span><span class="eyebrow" style="margin:0" data-bind="home.services.eyebrow"></span></div>
          <h2 data-bind="home.services.title"></h2>
          <div class="services-cols">
            <div class="services-col"><h3 data-bind="home.services.sundayLabel"></h3><dl id="svc-sunday"></dl></div>
            <div class="services-col"><h3 data-bind="home.services.weekdayLabel"></h3><dl id="svc-weekday"></dl></div>
          </div>
          <a class="btn btn--block" href="contact.html#visit" data-bind="home.services.button"></a>
        </div>

        <div class="card reveal reveal-delay-1">
          <div class="section-head" style="margin-bottom:1.5rem">
            <div class="card-title" style="margin:0"><span data-icon="calendar"></span><h2 style="font-size:clamp(1.9rem,3vw,2.5rem);margin:0" data-bind="home.events.title"></h2></div>
            <a class="text-link" href="events.html"><span data-bind="home.events.link"></span><span data-icon="arrow"></span></a>
          </div>
          <div class="event-cards" id="home-events"></div>
        </div>
      </div>
    </section>

    <div class="section-divider"><div data-divider></div></div>

    <!-- LEADERSHIP + APOSTOLIC IDENTITY -->
    <section class="section section--mist">
      <div class="container leaders-identity">
        <div class="card reveal">
          <div class="card-title"><span data-icon="people"></span><h2 style="font-size:clamp(1.8rem,3vw,2.3rem);margin:0" data-bind="home.leadership.title"></h2></div>
          <div class="leader-pair" id="home-leaders"></div>
          <a class="btn btn--block" href="leadership.html"><span data-bind="home.leadership.button"></span><span data-icon="arrow"></span></a>
        </div>

        <div class="card identity reveal reveal-delay-1">
          <div class="identity-main">
            <div class="identity-head"><span data-icon="cross"></span><div><h2 data-bind="home.identity.title"></h2><p data-bind="home.identity.subtitle"></p></div></div>
            <ul class="identity-grid" id="identity-grid"></ul>
          </div>
          <div class="identity-quote" data-quote="home.identity.quote"></div>
        </div>
      </div>
    </section>

    <!-- BANNER -->
    <section class="banner on-dark" aria-labelledby="banner-title">
      <div class="container">
        <div class="banner-cross" data-cross></div>
        <h2 id="banner-title" class="reveal" data-bind="home.banner.title"></h2>
        <p class="reveal reveal-delay-1" data-bind="home.banner.text"></p>
      </div>
      <div class="banner-water" aria-hidden="true">
        <svg viewBox="0 0 1440 90" preserveAspectRatio="none"><path fill="#3d60d6" fill-opacity=".35" d="M0 50 Q 180 20 360 50 T 720 50 T 1080 50 T 1440 50 V90 H0z"/><path fill="#dcbc6e" fill-opacity=".18" d="M0 68 Q 240 46 480 68 T 960 68 T 1440 68 V90 H0z"/></svg>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <noscript><p style="padding:1rem;text-align:center">Please enable JavaScript to view this website's content.</p></noscript>
</body>
</html>
