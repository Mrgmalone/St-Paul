<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>About Us | St. Paul Apostolic Church of Jesus Christ</title>
  <meta name="description" content="The heritage, mission, vision, and beliefs of St. Paul Apostolic Church of Jesus Christ, serving God and Greensboro since 1969.">
  <meta name="theme-color" content="#0a1a48">
  <meta property="og:type" content="website">
  <meta property="og:title" content="About Us | St. Paul Apostolic Church of Jesus Christ">
  <meta property="og:description" content="A Christ-centered Apostolic church in Greensboro, North Carolina.">
  <meta property="og:image" content="assets/img/brand/social-preview.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/brand/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/img/brand/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preload" as="image" href="assets/img/photos/worship-congregation-1920.webp" imagesrcset="assets/img/photos/worship-congregation-960.webp 960w, assets/img/photos/worship-congregation-1920.webp 1920w" imagesizes="100vw">
  <script src="js/site.js" defer></script>
</head>
<body data-page="about">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <section class="hero hero--page" aria-labelledby="hero-title">
      <div class="hero-media" data-hero="about.hero"></div>
      <div class="container hero-inner">
        <div class="reveal">
          <h1 id="hero-title" data-bind="about.hero.title"></h1>
          <p class="hero-sub" data-bind="about.hero.subtitle"></p>
          <p class="hero-text" data-bind="about.hero.text"></p>
        </div>
        <div class="hero-figure reveal reveal-delay-2" id="exterior"></div>
      </div>
      <div class="hero-wave"></div>
    </section>

    <section class="section">
      <div class="container about-layout">
        <div class="about-list" id="about-sections"></div>
        <aside class="about-aside">
          <div class="card scripture-card reveal"><div data-divider></div><div data-quote="about.quote"></div></div>
          <div class="card reveal">
            <div class="timeline-head"><span class="eyebrow" data-bind="about.timeline.eyebrow"></span><h3 data-bind="about.timeline.title"></h3></div>
            <ol class="timeline" id="timeline"></ol>
          </div>
        </aside>
      </div>
    </section>

    <section class="section section--pale">
      <div class="container">
        <div class="section-head section-head--center"><div data-divider></div><h2 data-bind="about.photos.title"></h2></div>
        <div class="photo-strip" id="history-photos"></div>
        <p style="text-align:center;margin-top:2.5rem"><a class="btn" id="history-button" href="#story"></a></p>
      </div>
    </section>

    <section class="banner on-dark" aria-labelledby="banner-title">
      <div class="container">
        <div class="banner-cross" data-cross></div>
        <h2 id="banner-title" class="reveal" data-bind="home.banner.title"></h2>
        <p class="reveal reveal-delay-1" data-bind="home.banner.text"></p>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <noscript><p style="padding:1rem;text-align:center">Please enable JavaScript to view this website's content.</p></noscript>
</body>
</html>
